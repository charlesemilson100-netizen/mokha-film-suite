<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="MOKHA FILM Suite - Professional AI Film Prompt Builder"
    />
    <title>MOKHA FILM Suite v2.0</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // Load the mokha-suite HTML directly
      fetch('./mokha-suite-pro.html')
        .then(r => r.text())
        .then(html => {
          document.documentElement.innerHTML = html;
        })
        .catch(err => {
          console.error('Failed to load app:', err);
          document.body.innerHTML = '<h1>Error loading app</h1>';
        });
    </script>
  </body>
</html>
